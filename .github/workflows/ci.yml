name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: node --test tests/unit/*.test.js
      - name: Test sources
        run: node tests/run.js --verbose
      - name: Build single-file bundle
        run: node scripts/build.js
      - name: Test bundle
        run: node tests/run.js --bundle --verbose
      - uses: actions/upload-artifact@v5
        if: matrix.node == 24
        with:
          name: nip.cjs
          path: dist/nip.cjs

  php-diff:
    # Compares directly with the system PHP (8.3.6 on the ubuntu-24.04 image).
    name: Differential test vs php 8.3
    runs-on: ubuntu-24.04
    env:
      # the runner image's PHP loads Xdebug, whose var_dump() and error output differ from plain PHP
      XDEBUG_MODE: 'off'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install PHP
        run: command -v php || (sudo apt-get update && sudo apt-get install -y php8.3-cli)
      - run: php --version && echo "::notice title=php::$(php -r 'echo PHP_VERSION;')"
      - run: node tests/run.js --php --verbose
