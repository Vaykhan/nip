name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Test sources
        run: node tests/run.js --verbose
      - name: Build single-file bundle
        run: node scripts/build.js
      - name: Test bundle
        run: node tests/run.js --bundle --verbose
      - uses: actions/upload-artifact@v5
        if: matrix.node == 24
        with:
          name: nip.cjs
          path: dist/nip.cjs

  php-diff:
    # Compares directly with the system PHP 8.3 (Ubuntu 24.04 ships 8.3.x); informational, since
    # patch releases newer than the 8.3.6 reference can legitimately differ.
    name: Differential test vs php 8.3
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install PHP
        run: command -v php || (sudo apt-get update && sudo apt-get install -y php8.3-cli)
      - run: php --version && echo "::notice title=php::$(php -r 'echo PHP_VERSION;')"
      - run: node tests/run.js --php --verbose
