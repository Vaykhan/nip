name: php-src tests

# Runs php-src's own .phpt tests with php 8.3 and NIP and reports how many produce identical output.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

jobs:
  phpt:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite:
          - tests/lang
          - Zend/tests
          - ext/standard/tests/strings
          - ext/standard/tests/array
          - ext/standard/tests/math
          - ext/json/tests
          - ext/pcre/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install PHP
        run: command -v php || (sudo apt-get update && sudo apt-get install -y php8.3-cli)
      - name: Fetch php-src tests
        run: |
          git clone --depth 1 --branch php-8.3.6 --filter=blob:none --sparse https://github.com/php/php-src.git php-src
          git -C php-src sparse-checkout set tests Zend/tests ext/standard/tests ext/json/tests ext/pcre/tests
      - name: Run
        run: node tests/phpt/runner.js "php-src/${{ matrix.suite }}" --out results.json | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
